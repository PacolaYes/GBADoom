name: Makefile CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: get deutex
      run: |
        sudo apt update
        sudo apt -y install deutex
    
    - name: build the wad
      run: |
        cd assets
        make
    
    - name: get wine
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: wine
        version: v1
    
    - name: convert wad
      run: |
        cd rom/GbaWadUtil
        wine GbaWadUtil.exe -in ../../assets/srb2.wad -cfile ../source/iwad/srb2.c

    - name: build the rom
      run: |
        cd rom
        make -j $(nrpoc) TARGET=GBASRB2
    

