name: Makefile CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: install dkp-pacman
      run: |
        wget -U "dkp-apt" https://apt.devkitpro.org/install-devkitpro-pacman
        chmod +x ./install-devkitpro-pacman
        sudo ./install-devkitpro-pacman
        sudo dkp-pacman -Syu

    - name: install gba-dev
      run: sudo dkp-pacman -S --confirm gba-dev
    
    - name: get deutex
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: wine deutex
        version: v1
    
    - name: build the wad
      run: |
        cd assets
        make
    
    - name: convert wad
      run: |
        cd rom/GbaWadUtil
        wine GbaWadUtil.exe -in ../../assets/srb2.wad -cfile ../source/iwad/srb2.c

    - name: build the rom
      run: |
        cd rom
        make -j $(nrpoc) TARGET=GBASRB2
    

