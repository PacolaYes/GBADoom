name: Makefile CI

on:
  push:
    paths:
      rom/
      assets/
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: get dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: deutex qtbase5-dev zstd
        version: v1
    
    - name: build the wad
      run: |
        cd assets
        make DEUTEX=/usr/games/deutex

    - name: cache GbaWadUtil
      id: cache-wadutil
      uses: actions/cache@v5
      with:
        path: /usr/local/bin/GbaWadUtil
        key: GbaWadUtil
    
    - name: compile GbaWadUtil
      if: steps.cache-wadutil.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/doomhack/GbaWadUtil.git && cd GbaWadUtil
        sudo apt update
        sudo apt-get -y install qt5-qmake

        qmake
        make -j $(nproc)
        sudo mv GbaWadUtil /usr/local/bin
    
    - name: convert wad
      run: |
        mkdir -p rom/source/iwad
        GbaWadUtil -in assets/srb2.wad -cfile rom/source/iwad/srb2.c

    - name: downgrade devkitarm # as a bypass to the glitch that i dont know how to fix and is stupid and im also stupid since i cant fix it
      run: |
        wget -O devkitARM.tar.zst https://wii.leseratte10.de/devkitPro/devkitARM/r66%20%282025-05-05%29/devkitARM-r66-1-linux_x86_64.pkg.tar.zst
        tar -xf devkitARM.tar.zst
        mv ./opt/devkitpro/devkitARM/ $DEVKITARM

    - name: build the rom
      run: |
        cd rom
        make -j $(nproc) TARGET=GBASRB2
    
    - name: upload nigthly build
      uses: andelf/nightly-release@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: nigthly
        name: "GBA SRB2 Nightly Release"
        prerelease: true
        body: "TODO: do something about this"
        files: rom/GBASRB2.gba
    

