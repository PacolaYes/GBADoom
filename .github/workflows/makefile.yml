name: Makefile CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: allow i386 to be sure
      run: sudo dpkg --add-architecture i386
    
    - name: get dependencies
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: wine64 wine32:i386 deutex
        version: v1.0
    
    - name: build the wad
      run: |
        cd assets
        make DEUTEX=/usr/games/deutex
    
    - name: convert wad
      run: |
        cd rom/GbaWadUtil
        wine-stable GbaWadUtil.exe -in ../../assets/srb2.wad -cfile ../source/iwad/srb2.c

    - name: build the rom
      run: |
        cd rom
        make -j $(nrpoc) TARGET=GBASRB2
    

