name: Makefile CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    
    - name: get deutex
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: deutex
        version: v1.0
    
    - name: build the wad
      run: |
        cd assets
        make DEUTEX=/usr/games/deutex

    - name: cache GbaWadUtil
      id: cache-wadutil
      uses: actions/cache@v5
      with:
        path: /usr/local/bin/GbaWadUtil
        key: GbaWadUtil
    
    - name: compile GbaWadUtil
      if: steps.cache-wadutil.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/doomhack/GbaWadUtil.git && cd GbaWadUtil
        sudo apt update
        sudo apt-get -y install qtbase5-dev qt5-qmake

        qmake
        make -j $(nproc)
        sudo mv GbaWadUtil /usr/local/bin
    
    - name: convert wad
      run: |
        mkdir -p rom/source/iwad
        GbaWadUtil -in assets/srb2.wad -cfile rom/source/iwad/srb2.c

    - name: build the rom
      run: |
        cd rom
        make -j $(nproc) TARGET=GBASRB2
    

